[package]
name = "selfplay-pybind"
edition.workspace = true
version.workspace = true

[lib]
name = "_engine"
crate-type = ["cdylib"]

[dependencies]
selfplay-engine = { path = "../engine" }
pyo3 = { version = "0.29", features = ["extension-module"] }
mimalloc = { version = "0.1", default-features = false }
